# Test the package on every Python version it claims to support:
# pyproject.toml declares classifiers for 3.10, 3.11, 3.12 and 3.13 and
# `requires-python = ">=3.10"`.
#
# Scope: a syntax/unused-name lint (`ruff --select F,E9`, the same gate
# OpenRelTime-Studio runs) plus an advisory mypy pass, the unit suite under
# `tests/`, the end-to-end suite under `e2e_tests/`, and a smoke run against
# the *oldest* dependency versions pyproject claims to support.
#
# macOS is tested on the latest Python only: free-tier macOS runners queue
# for a long time and dominated total CI wall-clock, and for pure-Python
# code the 3.10-3.12 differences are platform-independent, so Ubuntu covers
# them.
#
# `mypy` runs advisory (continue-on-error): the codebase still has a baseline
# of type findings (Optional handling etc.) that need domain decisions before
# the gate can be made hard.  It must run with `--python-version 3.12`
# because numpy's shipped stubs use PEP 695 `type` statements, which abort
# mypy's parser at 3.10 (see [tool.mypy] in pyproject.toml).
#
# The `blb` and `megacc` cases shell out to IQ-TREE and MEGA-CC.  Those tools
# are not installed here, so those two modules skip; the rest of `e2e_tests/`
# runs for real.  Unit tests cover both bridges against stubbed executables.
#
# The desktop GUI is a separate project, OpenRelTime-Studio, and has its own CI.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint (ruff + mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install package with its test extras
        # `dev` = pytest, pytest-cov, ruff, mypy; `plot` = matplotlib, which
        # the `ddbd` plotting test exercises through openreltime.viz.
        run: |
          python -m pip install --upgrade pip
          python -m pip install --editable ".[dev,plot]"

      - name: Lint (syntax and unused names)
        run: python -m ruff check . --select F,E9

      - name: Type check (advisory)
        # Advisory until the existing type-finding baseline is resolved;
        # remove `continue-on-error` afterwards to make this a hard gate.
        continue-on-error: true
        run: python -m mypy openreltime --python-version 3.12

  test:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        exclude:
          # macOS runners are the CI bottleneck; one recent interpreter
          # catches platform-specific breakage without triple the queue time.
          - os: macos-latest
            python-version: "3.10"
          - os: macos-latest
            python-version: "3.11"
          - os: macos-latest
            python-version: "3.12"
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package with its test extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install --editable ".[dev,plot]"

      - name: Show collected tests
        run: python -m pytest --collect-only -q

      - name: Run test suite
        # Test collection is driven by `testpaths` in pyproject.toml.
        run: python -m pytest -ra

      - name: Run end-to-end suite
        # Drives the real CLI against the bundled example and golden data.
        # No --continue-on-collection-errors: a module that cannot even be
        # imported must fail the job, not be tolerated.
        run: python -m pytest e2e_tests/cases -ra

  minimum-versions:
    name: pytest (minimum supported dependency versions)
    # Keeps the `>=` floors in pyproject.toml honest: installs exactly the
    # oldest versions declared in .github/constraints-minimum.txt, so a
    # change that silently starts depending on a newer numpy/scipy/pandas
    # fails here instead of breaking users on older stacks.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python 3.10
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: .github/constraints-minimum.txt

      - name: Install package against pinned minimums
        env:
          PIP_CONSTRAINT: .github/constraints-minimum.txt
        run: |
          python -m pip install --upgrade pip
          python -m pip install --editable ".[dev,plot]"

      - name: Show resolved dependency versions
        run: python -m pip list | grep -iE "^(numpy|scipy|pandas|matplotlib|click) "

      - name: Run test suite
        run: python -m pytest -ra

      - name: Run end-to-end suite
        run: python -m pytest e2e_tests/cases -ra

  ci-ok:
    name: all-green
    # Aggregate gate for branch protection: only this check needs to be
    # required, and the whole matrix stays enforced even when jobs are
    # added, renamed or removed.
    needs: [lint, test, minimum-versions]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any required job failed, was cancelled or was skipped
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          if echo "$RESULTS" | grep -Eq '"(failure|cancelled|skipped)"'; then
            echo "::error::Not all CI jobs succeeded: $RESULTS"
            exit 1
          fi
