# Build the sdist and wheel for a tagged release and attach them to the
# GitHub Release.  Runs when a `v*` tag is pushed (the v0.1.0 assets were
# attached manually; this automates the same steps for later releases).
#
# Uses only first-party actions pinned by commit SHA plus the `gh` CLI that
# ships on the runner — no third-party publish actions.  No PyPI upload yet:
# if/when the package is published to PyPI, add Trusted Publishing on PyPI
# and a publishing job here.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  build-and-upload:
    name: Build sdist & wheel and attach to release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install build tool
        run: python -m pip install --upgrade pip build

      - name: Build sdist and wheel
        run: python -m build

      - name: Create the release if needed, then upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
