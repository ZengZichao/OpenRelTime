# Build the sdist and wheel for a tagged release, attach them to the GitHub
# Release, and publish them to PyPI via Trusted Publishing (OIDC — no API
# token stored in the repository).
#
# Triggers: a pushed `v*` tag (the normal release path) and a manual
# workflow_dispatch (used for the initial PyPI publish of v0.1.1, which was
# released before this workflow existed, without re-tagging).
#
# One-time PyPI setup: register the pending publisher at
# https://pypi.org/manage/account/publishing/ with the exact mapping
#   PyPI project: openreltime · Owner: ZengZichao · Repository: OpenRelTime
#   Workflow: release.yml · Environment: pypi
#
# Actions are pinned by commit SHA, matching the rest of this repository.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  build-and-upload:
    name: Build sdist & wheel and attach to release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install build tool
        run: python -m pip install --upgrade pip build

      - name: Build sdist and wheel
        run: python -m build

      - name: Upload dist artifacts for the publish job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

      - name: Create the release if needed, then upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
              || gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            echo "Manual dispatch on $GITHUB_REF_NAME — build only, no GitHub release step."
          fi

  publish-pypi:
    name: Publish to PyPI (Trusted Publishing)
    needs: build-and-upload
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write # OIDC token for PyPI Trusted Publishing
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
